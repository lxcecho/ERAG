# ============================================================
# ERAG 企业级 AI 知识库助手 - 一体化部署编排
# ------------------------------------------------------------
# 服务清单（按依赖顺序）：
#   基础设施：mysql / etcd / milvus-minio / milvus / elasticsearch / rabbitmq / redis / minio
#   应用层  ：backend / frontend
# 消息队列用 RabbitMQ（项目任务系统：消息重试/死信/幂等/补偿基于 RabbitMQ DLX 实现）
# 所有配置走 .env 环境变量，数据持久化 ./data/，日志挂载 ./logs/
# 启动：docker compose up -d    （首次会构建前后端镜像）
# ============================================================
name: erag

services:

  # ==================== 1. MySQL 8.0（业务库 + 初始化建表） ====================
  mysql:
    image: mysql:8.0
    container_name: erag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: knowledge_ai
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [erag-net]

  # ==================== 2. etcd（Milvus 元数据存储，Milvus 专用） ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: erag-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [erag-net]

  # ==================== 3. milvus-minio（Milvus 内部对象存储，不对外暴露） ====================
  milvus-minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: erag-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./data/milvus-minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [erag-net]

  # ==================== 4. Milvus 向量数据库（standalone，依赖 etcd + milvus-minio） ====================
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: erag-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      TZ: Asia/Shanghai
    command: ["milvus", "run", "standalone"]
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
      - ./logs/milvus:/var/log/milvus
    depends_on:
      etcd: { condition: service_healthy }
      milvus-minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [erag-net]

  # ==================== 5. Elasticsearch 8.x（混合检索词法路，单节点 + 关闭安全认证） ====================
  # 注意：ES 8.x 默认开启 xpack 安全认证，项目 es.username/password 配置为空（无认证），
  #       故关闭 xpack.security.enabled 与项目配置一致，简化部署。
  # 前置：宿主机需执行 sysctl -w vm.max_map_count=262144（见 deploy.md 前置准备）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: erag-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: erag-es
      bootstrap.memory_lock: "true"
      TZ: Asia/Shanghai
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
      - ./logs/es:/usr/share/elasticsearch/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [erag-net]

  # ==================== 6. RabbitMQ（文档解析任务队列：重试/死信/幂等/补偿） ====================
  # 5672=AMQP，15672=管理界面。自定义账号（guest 仅限 localhost 跨容器不可用）
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: erag-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-erag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erag123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [erag-net]

  # ==================== 7. Redis（全局缓存：Prompt模板 / KB元数据 / AI统计 / 检索结果） ====================
  redis:
    image: redis:7.4-alpine
    container_name: erag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
      - ./logs/redis:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [erag-net]

  # ==================== 9. MinIO（应用文件存储，暴露 API + Console） ====================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: erag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${KB_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${KB_STORAGE_MINIO_SECRET_KEY:-minioadmin123}
      TZ: Asia/Shanghai
    command: minio server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
      - ./logs/minio:/var/log/minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [erag-net]

  # ==================== 10. MinIO 初始化（一次性：创建 knowledge-files bucket） ====================
  minio-init:
    image: minio/mc:RELEASE.2024-06-13T22-53-53Z
    container_name: erag-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${KB_STORAGE_MINIO_ACCESS_KEY:-minioadmin} ${KB_STORAGE_MINIO_SECRET_KEY:-minioadmin123};
      mc mb local/${KB_STORAGE_MINIO_BUCKET:-knowledge-files} --ignore-existing;
      echo '[MinIO] bucket ${KB_STORAGE_MINIO_BUCKET:-knowledge-files} 就绪';
      "
    networks: [erag-net]

  # ==================== 11. 后端应用（Spring Boot，依赖全部中间件就绪） ====================
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: erag-backend:latest
    container_name: erag-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      MILVUS_HOST: milvus
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      KB_STORAGE_MINIO_ENDPOINT: http://minio:9000
      ES_URIS: http://elasticsearch:9200
      KB_PARSE_MQ_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./logs/backend:/app/logs
      - ./data/files:/app/data/files
    depends_on:
      mysql: { condition: service_healthy }
      milvus: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [erag-net]

  # ==================== 12. 前端应用（Nginx，反代后端 + 静态资源） ====================
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: erag-frontend:latest
    container_name: erag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend: { condition: service_started }
    networks: [erag-net]

# ==================== 网络 ====================
networks:
  erag-net:
    name: erag-net
    driver: bridge
