# ERAG CI/CD Pipeline
# 触发条件：push/PR 到 main/develop 分支
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================== 后端构建与测试 ====================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -B -DskipTests

      - name: Run Unit Tests
        run: mvn test -B -pl knowledge-common,knowledge-infra,knowledge-system,knowledge-auth,knowledge-kb,knowledge-ai,knowledge-agent

      - name: Generate Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: '**/surefire-reports/*.xml'
          reporter: java-junit

      - name: Build JAR
        run: mvn package -B -DskipTests -pl knowledge-admin -am

      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-admin-jar
          path: knowledge-backend/knowledge-admin/target/*.jar
          retention-days: 7

  # ==================== 前端构建与检查 ====================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: knowledge-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload Frontend artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: knowledge-frontend/dist/
          retention-days: 7

  # ==================== Docker 构建（仅 main 分支 push） ====================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: knowledge-admin-jar
          path: knowledge-backend/knowledge-admin/target/

      - name: Download Frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: knowledge-frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/erag-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/erag-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/erag-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/erag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 安全扫描 ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ backend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
